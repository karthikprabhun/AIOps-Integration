# camel-ai-agent-demo configuration

# Camel application settings
camel.main.name = CamelAiAgentDemo
camel.main.routes-include-pattern = classpath:routes/*.yaml,routes/*.yaml

# Server & HTTP Port
server.port = 8080

#Prometheus settings
mock.prometheus.enabled = true
prometheus.url = http://localhost:8080/mock/prometheus/api/v1/query

#Weather API settings ( Just for testing the Camel AI Agent Demo )
mock.weather.enabled = true
weather.api.key = dummy-api-key-12345
weather.url = http://localhost:8080/mock/weather/api/v1/data

#Vector Store & LLM
spring.ai.openai.api-key = dummy-openai-api-key
spring.ai.openai.base-url = http://localhost:8080/mock/openai
spring.ai.openai.chat.options.model = gpt-4o-mini
spring.ai.openai.embedding.options.model = text-embedding-ada-002
